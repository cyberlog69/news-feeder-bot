name: 🚀 Auto-Deploy to GCP VM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to GCP Compute Engine
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 SSH to GCP and Redeploy
        env:
          SSH_HOST: ${{ secrets.GCP_HOST }}
          SSH_USER: ${{ secrets.GCP_USERNAME }}
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: One or more GitHub Secrets (GCP_HOST, GCP_USERNAME, GCP_SSH_KEY) are missing or empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Use Python to flawlessly normalize key line breaks (fixes 'error in libcrypto')
          python3 - << 'PYEOF'
          import os, base64

          raw = os.environ.get("SSH_KEY", "").strip()

          # If the secret is Base64 encoded, decode it
          if "BEGIN" not in raw and "PRIVATE KEY" not in raw:
              try:
                  decoded = base64.b64decode(raw).decode('utf-8')
                  if "BEGIN" in decoded and "PRIVATE KEY" in decoded:
                      raw = decoded
              except Exception:
                  pass

          # Normalize literal '\n' characters into real newlines and strip carriage returns
          raw = raw.replace('\\n', '\n').replace('\r', '')

          key_path = os.path.expanduser("~/.ssh/deploy_key")
          with open(key_path, "w", encoding="utf-8") as f:
              f.write(raw.strip() + "\n")
          PYEOF

          chmod 600 ~/.ssh/deploy_key

          # Verify key structure
          echo "✅ Key header:"
          head -n 1 ~/.ssh/deploy_key
          echo "✅ Key footer:"
          tail -n 1 ~/.ssh/deploy_key

          # Add remote host key to known_hosts
          ssh-keyscan -H -p 22 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "🚀 Connecting to $SSH_USER@$SSH_HOST..."

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" bash -s << 'EOF'
            set -e

            # Locate news-feeder-bot directory
            if [ -d "$HOME/news-feeder-bot" ]; then
              cd "$HOME/news-feeder-bot"
            elif [ -d "/opt/news-feeder-bot" ]; then
              cd "/opt/news-feeder-bot"
            elif [ -d "news-feeder-bot" ]; then
              cd "news-feeder-bot"
            fi

            echo "📦 Pulling latest changes from GitHub..."
            git pull origin master || git pull origin main

            echo "🔨 Rebuilding and restarting Docker container..."
            docker compose up -d --build

            echo "🧹 Cleaning up old dangling images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
            docker compose ps
          EOF
